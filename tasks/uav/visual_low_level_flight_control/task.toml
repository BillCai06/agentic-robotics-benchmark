schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/visual_low_level_flight_control"

[metadata]
platform = "uav"

[environment]
cpus = 2
memory_mb = 4096
gpus = 0

[[environment.mcp_servers]]
name = "robot"
transport = "stdio"
command = "/opt/venv/bin/python3"
args = ["/opt/visual_robotics/client/mcp_stdio.py"]

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 5400
